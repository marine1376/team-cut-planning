<!DOCTYPE html>
<div class="header">
        <div class="title-section">
            <h1 id="pageTitle">Où est la team CUT. ? 🚀</h1>
            <p class="subtitle">Indiquer votre présence site ou TT sur Teams/Outlook également</p>
        </div>
        <div class="week-nav">
            <button onclick="changeWeek(-1)">‹</button>
            <div class="week-info">
                <div class="week-number" id="weekNumber">Semaine 40</div>
                <div class="week-dates" id="weekDates">du 28 sept. au 2 oct.</div>
            </div>
            <button onclick="changeWeek(1)">›</button>
        </div>
    </div>
    
    <div class="user-selector" id="userSelector">
        <span>Tu es :</span>
    </div>
    
    <div class="status-bar">
        <span id="statusBar"><strong>0/6</strong> ont tout rempli.</span>
        <span class="sync-status loading" id="syncStatus">⏳ Chargement...</span>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th id="th-0"><span class="day-name">Lun</span><span class="day-number"></span></th>
                    <th id="th-1"><span class="day-name">Mar</span><span class="day-number"></span></th>
                    <th id="th-2"><span class="day-name">Mer</span><span class="day-number"></span></th>
                    <th id="th-3"><span class="day-name">Jeu</span><span class="day-number"></span></th>
                    <th id="th-4"><span class="day-name">Ven</span><span class="day-number"></span></th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
    
    <div class="legend">
        <div class="legend-item"><span>🏢</span> Puteaux</div>
        <div class="legend-item"><span>⛪</span> Pantin</div>
        <div class="legend-item"><span>🏠</span> Télétravail</div>
        <div class="legend-item"><span>🎥</span> Shoot</div>
        <div class="legend-item"><span>🌴</span> Off</div>
        <div class="legend-item"><span>📍</span> Autre</div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Marine</h2>
        <div class="modal-date" id="modalDate">lundi 28 septembre</div>
        
        <div class="options-grid">
            <button class="option-btn puteaux" data-value="puteaux" onclick="selectOption('puteaux')">
                <span class="emoji">🏢</span>
                <span class="label">Puteaux</span>
            </button>
            <button class="option-btn pantin" data-value="pantin" onclick="selectOption('pantin')">
                <span class="emoji">⛪</span>
                <span class="label">Pantin</span>
            </button>
            <button class="option-btn teletravail" data-value="teletravail" onclick="selectOption('teletravail')">
                <span class="emoji">🏠</span>
                <span class="label">Télétravail</span>
            </button>
            <button class="option-btn shoot" data-value="shoot" onclick="selectOption('shoot')">
                <span class="emoji">🎥</span>
                <span class="label">Shoot</span>
            </button>
            <button class="option-btn autre" data-value="autre" onclick="selectOption('autre')">
                <span class="emoji">📍</span>
                <span class="label">Autre</span>
            </button>
            <button class="option-btn off" data-value="off" onclick="selectOption('off')">
                <span class="emoji">🌴</span>
                <span class="label">Off</span>
            </button>
        </div>
        
        <div class="precision-section">
            <label>Précision (facultatif, obligatoire pour Autre)</label>
            <input type="text" id="precisionInput" placeholder="Ex. rdv client, Cannes, formation...">
        </div>
        
        <div class="apply-week">
            <input type="checkbox" id="applyWeek">
            <label for="applyWeek">Appliquer à toute la semaine</label>
        </div>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Annuler</button>
            <button class="btn-save" onclick="saveSelection()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyw0jpzJfXOx6zPyJMqXYhcZWUKuYcJQkrfFZ-22vXEf_kOTZ5kEtCSpqZOKNrpuic/exec';
    
    const teams = {
        CUT: {
            name: 'CUT',
            title: 'Où est la team CUT. ? 🚀',
            emoji: '🚀',
            members: ['Marine', 'Nicolas', 'Pauline', 'Martin', 'Emma', 'Aline'],
            bgClass: 'team-cut'
        },
        HERAW: {
            name: 'HERAW',
            title: 'Où est la team HERAW ? 🧨',
            emoji: '🧨',
            members: ['Yaël', 'Juliette', 'Léonie', 'Chloé'],
            bgClass: 'team-heraw'
        }
    };
    
    const options = {
        puteaux: { emoji: '🏢', label: 'Puteaux' },
        pantin: { emoji: '⛪', label: 'Pantin' },
        teletravail: { emoji: '🏠', label: 'Télétravail' },
        shoot: { emoji: '🎥', label: 'Shoot' },
        off: { emoji: '🌴', label: 'Off' },
        autre: { emoji: '📍', label: 'Autre' }
    };
    
    let currentTeam = 'CUT';
    let currentUser = 'Marine';
    let currentWeekOffset = 0;
    let currentSelection = null;
    let currentCell = null;
    let data = {};
    let isOnline = false;

    function switchTeam(team) {
        currentTeam = team;
        const teamConfig = teams[team];
        
        document.body.className = teamConfig.bgClass;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.tab-btn.${team.toLowerCase()}`).classList.add('active');
        
        document.getElementById('pageTitle').textContent = teamConfig.title;
        
        renderUserSelector();
        
        currentUser = teamConfig.members[0];
        
        loadData();
    }
    
    function renderUserSelector() {
        const container = document.getElementById('userSelector');
        const teamConfig = teams[currentTeam];
        
        let html = '<span>Tu es :</span>';
        teamConfig.members.forEach((member, index) => {
            const isActive = index === 0 ? 'active' : '';
            html += `<button class="user-btn ${isActive}" onclick="selectUser('${member}')">${member}</button>`;
        });
        html += `<button class="refresh-btn" onclick="loadData()">🔄 Actualiser</button>`;
        
        container.innerHTML = html;
    }

    function setSyncStatus(status, message) {
        const el = document.getElementById('syncStatus');
        el.className = 'sync-status ' + status;
        if (status === 'success') {
            el.textContent = '✅ ' + message;
        } else if (status === 'error') {
            el.textContent = '❌ ' + message;
        } else {
            el.textContent = '⏳ ' + message;
        }
    }

    async function loadData() {
        setSyncStatus('loading', 'Chargement...');
        try {
            const response = await fetch(SCRIPT_URL + '?action=get&team=' + currentTeam, {
                method: 'GET',
                mode: 'cors',
                redirect: 'follow'
            });
            
            if (!response.ok) throw new Error('Network response was not ok');
            
            const rows = await response.json();
            
            data = {};
            rows.forEach(row => {
                if (!data[row.semaine]) data[row.semaine] = {};
                if (!data[row.semaine][row.membre]) data[row.semaine][row.membre] = {};
                data[row.semaine][row.membre][row.jour] = {
                    type: row.lieu,
                    precision: row.precision
                };
            });
            
            isOnline = true;
            setSyncStatus('success', 'Synchronisé');
            renderTable();
        } catch (error) {
            console.error('Load error:', error);
            isOnline = false;
            setSyncStatus('error', 'Erreur de connexion');
            renderTable();
        }
    }

    async function saveToServer(semaine, membre, jour, lieu, precision) {
        try {
            const params = new URLSearchParams({
                action: 'save',
                team: currentTeam,
                semaine: semaine,
                membre: membre,
                jour: jour,
                lieu: lieu,
                precision: precision || ''
            });
            
            await fetch(SCRIPT_URL + '?' + params.toString(), {
                method: 'GET',
                mode: 'cors',
                redirect: 'follow'
            });
            
            setSyncStatus('success', 'Enregistré !');
            setTimeout(() => {
                if (isOnline) setSyncStatus('success', 'Synchronisé');
            }, 2000);
            
            return true;
        } catch (error) {
            console.error('Save error:', error);
            setSyncStatus('error', 'Erreur de sauvegarde');
            return false;
        }
    }
    
    function getWeekKey(offset) {
        const date = new Date();
        date.setDate(date.getDate() + (offset * 7));
        const startOfWeek = getStartOfWeek(date);
        const weekNum = getWeekNumber(startOfWeek);
        return `${startOfWeek.getFullYear()}-W${weekNum}`;
    }
    
    function getStartOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        return d;
    }
    
    function getNextWeekStart() {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const daysUntilNextMonday = dayOfWeek === 0 ? 1 : 8 - dayOfWeek;
        const nextMonday = new Date(today);
        nextMonday.setDate(today.getDate() + daysUntilNextMonday);
        return nextMonday;
    }
    
    function initWeekOffset() {
        const today = new Date();
        const nextWeekStart = getNextWeekStart();
        const diffTime = nextWeekStart - getStartOfWeek(today);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        currentWeekOffset = Math.floor(diffDays / 7);
    }
    
    function getWeekNumber(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }
    
    function formatDate(date) {
        const months = ['janv.', 'fév.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
        return `${date.getDate()} ${months[date.getMonth()]}`;
    }
    
    function formatFullDate(date) {
        const daysNames = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
        const months = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        return `${daysNames[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
    }
    
    function updateWeekDisplay() {
        const today = new Date();
        today.setDate(today.getDate() + (currentWeekOffset * 7));
        const startOfWeek = getStartOfWeek(today);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 4);
        
        const weekNum = getWeekNumber(startOfWeek);
        document.getElementById('weekNumber').textContent = `Semaine ${weekNum}`;
        document.getElementById('weekDates').textContent = `du ${formatDate(startOfWeek)} au ${formatDate(endOfWeek)}`;
        
        for (let i = 0; i < 5; i++) {
            const dayDate = new Date(startOfWeek);
            dayDate.setDate(dayDate.getDate() + i);
            const th = document.getElementById(`th-${i}`);
            th.querySelector('.day-number').textContent = dayDate.getDate();
        }
        
        renderTable();
    }
    
    function changeWeek(delta) {
        currentWeekOffset += delta;
        updateWeekDisplay();
    }
    
    function selectUser(user) {
        currentUser = user;
        document.querySelectorAll('.user-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === user);
        });
    }
    
    function renderTable() {
        const weekKey = getWeekKey(currentWeekOffset);
        const teamConfig = teams[currentTeam];
        
        if (!data[weekKey]) {
            data[weekKey] = {};
        }
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        teamConfig.members.forEach(member => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${member}</td>`;
            
            for (let i = 0; i < 5; i++) {
                const td = document.createElement('td');
                const cellData = data[weekKey][member]?.[i];
                
                let content = '';
                if (cellData && options[cellData.type]) {
                    const opt = options[cellData.type];
                    content = `
                        <div class="cell-content filled ${cellData.type}" onclick="openModal('${member}', ${i})">
                            <span class="emoji">${opt.emoji}</span>
                            <span class="label">${opt.label}</span>
                            ${cellData.precision ? `<span class="precision" title="${cellData.precision}">${cellData.precision}</span>` : ''}
                        </div>
                    `;
                } else {
                    content = `
                        <div class="cell-content" onclick="openModal('${member}', ${i})">
                            <span class="plus-icon">+</span>
                        </div>
                    `;
                }
                td.innerHTML = content;
                row.appendChild(td);
            }
            
            tbody.appendChild(row);
        });
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = '<td>Total</td>';
        
        for (let i = 0; i < 5; i++) {
            const td = document.createElement('td');
            const counts = {};
            
            teamConfig.members.forEach(member => {
                const cellData = data[weekKey][member]?.[i];
                if (cellData && options[cellData.type]) {
                    counts[cellData.type] = (counts[cellData.type] || 0) + 1;
                }
            });
            
            let totalContent = '<div class="total-cell">';
            if (Object.keys(counts).length === 0) {
                totalContent += '—';
            } else {
                for (const [type, count] of Object.entries(counts)) {
                    totalContent += `<div class="total-item">${options[type].emoji} ${count}</div>`;
                }
            }
            totalContent += '</div>';
            td.innerHTML = totalContent;
            totalRow.appendChild(td);
        }
        
        tbody.appendChild(totalRow);
        
        updateStatusBar();
    }
    
    function updateStatusBar() {
        const weekKey = getWeekKey(currentWeekOffset);
        const teamConfig = teams[currentTeam];
        let completed = 0;
        const missing = [];
        
        teamConfig.members.forEach(member => {
            let filledDays = 0;
            for (let i = 0; i < 5; i++) {
                if (data[weekKey][member]?.[i]) {
                    filledDays++;
                }
            }
            if (filledDays === 5) {
                completed++;
            } else {
                missing.push(member);
            }
        });
        
        const total = teamConfig.members.length;
        const statusBar = document.getElementById('statusBar');
        if (missing.length === 0) {
            statusBar.innerHTML = `<strong>${completed}/${total}</strong> ont tout rempli. ✅ Tout le monde est à jour !`;
        } else {
            statusBar.innerHTML = `<strong>${completed}/${total}</strong> ont tout rempli. Manque : ${missing.join(', ')}`;
        }
    }
    
    function openModal(member, dayIndex) {
        if (member !== currentUser) {
            alert(`Tu dois te sélectionner en tant que "${member}" pour modifier cette case.`);
            return;
        }
        
        currentCell = { member, dayIndex };
        currentSelection = null;
        
        const today = new Date();
        today.setDate(today.getDate() + (currentWeekOffset * 7));
        const startOfWeek = getStartOfWeek(today);
        const dayDate = new Date(startOfWeek);
        dayDate.setDate(dayDate.getDate() + dayIndex);
        
        document.getElementById('modalTitle').textContent = member;
        document.getElementById('modalDate').textContent = formatFullDate(dayDate);
        
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById('precisionInput').value = '';
        document.getElementById('applyWeek').checked = false;
        
        const weekKey = getWeekKey(currentWeekOffset);
        const existing = data[weekKey]?.[member]?.[dayIndex];
        if (existing) {
            currentSelection = existing.type;
            const btn = document.querySelector(`.option-btn[data-value="${existing.type}"]`);
            if (btn) btn.classList.add('selected');
            document.getElementById('precisionInput').value = existing.precision || '';
        }
        
        document.getElementById('modalOverlay').classList.add('active');
    }
    
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        currentCell = null;
        currentSelection = null;
    }
    
    function selectOption(value) {
        currentSelection = value;
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.value === value);
        });
    }
    
    async function saveSelection() {
        if (!currentSelection) {
            alert('Veuillez sélectionner une option.');
            return;
        }
        
        const precision = document.getElementById('precisionInput').value.trim();
        
        if (currentSelection === 'autre' && !precision) {
            alert('Veuillez préciser le lieu pour "Autre".');
            return;
        }
        
        const weekKey = getWeekKey(currentWeekOffset);
        if (!data[weekKey]) data[weekKey] = {};
        if (!data[weekKey][currentCell.member]) data[weekKey][currentCell.member] = {};
        
        const applyToWeek = document.getElementById('applyWeek').checked;
        
        if (applyToWeek) {
            for (let i = 0; i < 5; i++) {
                data[weekKey][currentCell.member][i] = {
                    type: currentSelection,
                    precision: precision
                };
                await saveToServer(weekKey, currentCell.member, i, currentSelection, precision);
            }
        } else {
            data[weekKey][currentCell.member][currentCell.dayIndex] = {
                type: currentSelection,
                precision: precision
            };
            await saveToServer(weekKey, currentCell.member, currentCell.dayIndex, currentSelection, precision);
        }
        
        closeModal();
        renderTable();
    }
    
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
    
    initWeekOffset();
    renderUserSelector();
    updateWeekDisplay();
    loadData();
</script>
